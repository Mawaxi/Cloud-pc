name: cloud-pc-rdp

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
      - name: Create RDP User
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) { New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
      - name: Install and Configure OpenSSH Server
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          if (-not (Get-NetFirewallRule -Name sshd -ErrorAction SilentlyContinue)) { New-NetFirewallRule -Name sshd -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 }
          $pubkey = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBVXQujZ4M1bfUZU0I/Ylf95BrOgaZ9YjzQGsHA0OgNy hatch"
          $sshDir = "C:\Users\RDP\.ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          Set-Content -Path "$sshDir\authorized_keys" -Value $pubkey -Encoding ascii
          icacls $sshDir /inheritance:r /grant:r "SYSTEM:(OI)(CI)F" /grant:r "RDP:(OI)(CI)F"
          icacls "$sshDir\authorized_keys" /inheritance:r /grant:r "SYSTEM:F" /grant:r "RDP:F"
          $adminKeys = "C:\ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $adminKeys -Value $pubkey -Encoding ascii
          icacls $adminKeys /inheritance:r /grant:r "SYSTEM:F" /grant:r "Administrators:F"
          Write-Host "OpenSSH Server installed, sshd running, Muse key installed for RDP."
      - name: Install Tailscale
        run: |
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", $installerPath, "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) { $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4; Start-Sleep -Seconds 5; $retries++ }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned. Exiting."; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { Write-Error "TCP connection to RDP port 3389 failed"; exit 1 }
          Write-Host "TCP connectivity successful!"
          $sshTest = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 22
          if (-not $sshTest.TcpTestSucceeded) { Write-Error "TCP connection to SSH port 22 failed"; exit 1 }
          Write-Host "SSH port 22 reachable!"
      - name: Install Ollama and pull qwen3:4b
        run: |
          try {
            # NOTE: the Ollama installer (OllamaSetup.exe /S) HANGS when run
            # non-interactively on these runners (verified 27 Nov 2026: two
            # installer processes sat idle for 60+ min). Use the standalone
            # zip instead - it downloads in seconds and needs no installer.
            $zipPath = "$env:TEMP\ollama.zip"
            curl.exe -L -o $zipPath https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip
            Expand-Archive -Path $zipPath -DestinationPath "C:\ollama" -Force
            $ollamaExe = "C:\ollama\ollama.exe"
            if (-not (Test-Path $ollamaExe)) { Write-Warning "ollama.exe not found after extract"; throw "extract failed" }
            # Listen on all interfaces (so Mawaxi AI can reach it over
            # Tailscale) and keep the model loaded for 24h (default unload
            # is 5 min idle, which caused slow/error first replies).
            setx OLLAMA_HOST "0.0.0.0:11434" /M | Out-Null
            setx OLLAMA_KEEP_ALIVE "24h" /M | Out-Null
            $env:OLLAMA_HOST = "0.0.0.0:11434"
            # Run Ollama as a scheduled task (SYSTEM) so it keeps running
            # even when no session is attached - a plain Start-Process
            # child is killed when its session ends.
            schtasks /create /tn OllamaServe /tr "C:\ollama\ollama.exe serve" /sc onstart /ru SYSTEM /rl highest /f | Out-Null
            schtasks /run /tn OllamaServe | Out-Null
            $ok = $false
            for ($i=0; $i -lt 24; $i++) { try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:11434/api/tags" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { } ; Start-Sleep -Seconds 5 }
            if ($ok) { Write-Host "Ollama API is up."; & $ollamaExe pull qwen3:4b; & $ollamaExe list } else { Write-Warning "Ollama API did not come up; skipping model pull." }
          } catch { Write-Warning "Ollama setup failed: $_" }
      - name: Maintain Connection
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: (the RDP_PASSWORD secret you set)"
          Write-Host "=== SSH ACCESS ==="
          Write-Host "ssh RDP@$env:TAILSCALE_IP"
          Write-Host "SSH key auth enabled (Muse hatch key)."
          Write-Host "=== OLLAMA ==="
          Write-Host "Ollama API: http://$env:TAILSCALE_IP:11434"
          Write-Host "Model: qwen3:4b"
          Write-Host "=================="
          while ($true) { Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"; Start-Sleep -Seconds 300 }
